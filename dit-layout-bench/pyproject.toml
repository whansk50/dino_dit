[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dit-layout-bench"
version = "0.1.0"
description = "PubLayNet benchmark with a shared DiT backbone and switchable Cascade R-CNN/DINO detectors"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.21",
  "Pillow>=8",
  "torch>=1.9",
  "torchvision>=0.10",
  "pycocotools>=2.0.6",
]

[project.optional-dependencies]
dino = ["scipy", "termcolor", "addict", "yapf", "timm"]
test = ["pytest>=7"]

[project.scripts]
dit-layout-train = "dit_layout_bench.cli:train_entrypoint"
dit-layout-evaluate = "dit_layout_bench.cli:evaluate_entrypoint"
dit-layout-inference = "dit_layout_bench.cli:inference_entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

