[run]
detector = "dino"
device = "cuda"
seed = 42
num_workers = 4
amp = false

[paths]
data_root = ""
output_dir = "outputs"
pretrained = ""
resume = ""

[input]
short_edge_scales = [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
max_long_edge = 1333
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]
random_flip = "horizontal"

[training]
batch_size = 2
epochs = 12
detector_lr = 1e-4
backbone_lr = 1e-5
weight_decay = 0.05
warmup_iters = 1000
checkpoint_every_epochs = 1
evaluate_every_epochs = 1

[dit]
drop_path = 0.1
use_checkpoint = true

[dino]
hidden_dim = 256
num_feature_levels = 4
enc_layers = 6
dec_layers = 6
nheads = 8
num_queries = 300
num_select = 300
use_dn = true
dn_number = 100
lr_drop_epoch = 11
score_threshold = 0.5

[cascade]
score_threshold = 0.5
anchor_sizes = [32, 64, 128, 256]
aspect_ratios = [0.5, 1.0, 2.0]
lr_steps = [0.75, 0.9]
class_agnostic_bbox = true
